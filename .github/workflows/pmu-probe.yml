name: pmu probe
on:
  push:
    branches: [test/pmu-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: cpu and perf support
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Thread|Hypervisor"
          sudo apt-get install -y -qq linux-tools-common linux-tools-$(uname -r) valgrind >/dev/null 2>&1 || true
          sudo sysctl -w kernel.perf_event_paranoid=-1
          ls /sys/bus/event_source/devices/
          sudo perf stat -e instructions,cycles,branch-misses,cache-misses -- python3 -c "sum(range(10**7))" 2>&1 | tail -12
          valgrind --version
